<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI聊天小助手</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        textarea { min-height: 44px; max-height: 200px; transition: height 0.2s; }
        .typing-cursor::after { content: "|"; animation: blink 1s step-end infinite; }
        @keyframes blink { from, to { opacity: 1; } 50% { opacity: 0; } }
        .sidebar-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-gray-50">
<div id="app" class="flex h-screen overflow-hidden" :class="{ 'dark bg-gray-900': darkMode }">

    <aside :class="[
        'sidebar-transition flex-shrink-0 border-r z-20 flex flex-col relative',
        darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200',
        isSidebarOpen ? 'w-72' : 'w-0 overflow-hidden md:w-20'
    ]">
        <div class="p-4 border-b border-gray-100 dark:border-gray-700 flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <span v-if="isSidebarOpen" class="font-bold text-gray-700 dark:text-gray-200">对话</span>
                <button @click="isSidebarOpen = !isSidebarOpen" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
                    <i class="fas fa-bars text-gray-500"></i>
                </button>
            </div>

            <div v-if="isSidebarOpen" class="flex flex-col gap-2">
                <select v-model="currentAgentId" class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                    <option v-for="agent in agentList" :key="agent.id" :value="agent.id">
                        🤖 {{ agent.name }}
                    </option>
                </select>

                <button @click="startNewConversation" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition text-sm font-medium flex items-center justify-center shadow-sm">
                    <i class="fas fa-plus mr-2"></i> 新建对话
                </button>
            </div>
            <button v-else @click="startNewConversation" class="p-3 mx-auto bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition shadow-sm">
                <i class="fas fa-plus"></i>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-2 space-y-1">
            <div v-if="isSidebarOpen" class="px-3 py-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                历史记录
            </div>
            <div v-for="session in sessionList"
                 :key="session.id"
                 @click="handleSelectSession(session)"
                 :class="[
                     'p-3 rounded-lg cursor-pointer transition-colors flex items-center',
                     String(currentSessionId) === String(session.id)
                        ? 'bg-blue-50 text-blue-700 dark:bg-gray-700 dark:text-blue-400'
                        : 'text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700'
                 ]">
                <i class="far fa-comment-alt mr-3 text-gray-400"></i>
                <div v-if="isSidebarOpen" class="truncate text-sm font-medium flex-1">
                    {{ session.title || '新对话' }}
                </div>
            </div>

            <div v-if="sessionList.length === 0 && isSidebarOpen" class="text-center py-8 text-gray-400 text-sm">
                <i class="fas fa-inbox text-3xl mb-2 opacity-50"></i>
                <p>暂无历史对话</p>
            </div>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 relative">
        <header class="bg-white dark:bg-gray-800 shadow-sm py-3 px-4 flex items-center justify-between z-10 border-b dark:border-gray-700">
            <div class="flex items-center">
                <button @click="isSidebarOpen = !isSidebarOpen" class="md:hidden mr-3 p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg text-gray-500">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="text-xl font-bold text-blue-600 mr-4">AI聊天顾问助手</div>
                <div class="hidden sm:flex items-center px-3 py-1 rounded-full" :class="darkMode ? 'bg-gray-700 text-gray-200' : 'bg-gray-100 text-gray-600'">
                    <i class="fas fa-user-circle mr-2 text-blue-500"></i>
                    <span class="text-sm font-medium">{{ userNickname }}</span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <div class="hidden md:flex items-center space-x-2 mr-2 border-r pr-4 border-gray-200 dark:border-gray-700">
                    <button @click="goToRecharge" class="px-3 py-1.5 text-sm font-medium text-yellow-600 bg-yellow-50 hover:bg-yellow-100 rounded-md transition-colors">
                        <i class="fas fa-coins mr-1"></i> 充值
                    </button>
                    <button @click="goToLogin" class="px-3 py-1.5 text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-blue-600 transition-colors">登录</button>
                </div>
                <button @click="toggleDarkMode" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                    <i :class="darkMode ? 'fas fa-sun text-yellow-400' : 'fas fa-moon text-gray-600'"></i>
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 space-y-6" ref="chatContainer" :class="{ 'bg-gray-900': darkMode }">
            <div v-for="(message, index) in messages" :key="index" class="max-w-3xl mx-auto">
                <div :class="['flex', message.role === 'user' ? 'justify-end' : 'justify-start']">
                    <div :class="['flex items-start space-x-3', message.role === 'user' ? 'flex-row-reverse space-x-reverse' : '']">
                        <div :class="['w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0',
                                        message.role === 'user' ? 'bg-blue-100 text-blue-600' : 'bg-green-100 text-green-600']">
                            <i :class="message.role === 'user' ? 'fas fa-user' : 'fas fa-robot'"></i>
                        </div>
                        <div :class="['p-3 rounded-lg max-w-lg break-words shadow-sm',
                                        message.role === 'user'
                                            ? 'bg-blue-500 text-white'
                                            : darkMode ? 'bg-gray-800 text-gray-100 border border-gray-700' : 'bg-white border border-gray-100 text-gray-800']">
                            <div v-if="message.role === 'assistant' && message.isLoading" class="flex space-x-2 py-2 px-1">
                                <div class="w-2 h-2 rounded-full bg-gray-400 animate-pulse"></div>
                                <div class="w-2 h-2 rounded-full bg-gray-400 animate-pulse delay-100"></div>
                                <div class="w-2 h-2 rounded-full bg-gray-400 animate-pulse delay-200"></div>
                            </div>
                            <div v-else class="whitespace-pre-wrap leading-relaxed">
                                <span v-for="(char, charIndex) in message.content" :key="charIndex"
                                      :class="{'opacity-0': charIndex >= message.visibleChars}">{{ char }}</span>
                                <span v-if="message.isStreaming" class="typing-cursor"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer :class="['border-t p-4', darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200']">
            <div class="max-w-3xl mx-auto relative">
                <div class="flex items-end space-x-2">
                    <textarea
                            v-model="userInput"
                            @keydown.enter.exact.prevent="sendMessage"
                            placeholder="输入您的问题 (Shift+Enter 换行)..."
                            :class="['flex-1 border rounded-xl py-3 px-4 focus:outline-none focus:ring-2 resize-none transition-all',
                                darkMode ? 'bg-gray-700 border-gray-600 text-white focus:ring-blue-400 placeholder-gray-400' : 'border-gray-300 focus:ring-blue-500']"
                            rows="1" ref="textarea" @input="adjustTextareaHeight"
                    ></textarea>
                    <button
                            @click="isLoading ? stopResponse() : sendMessage()"
                            :disabled="!userInput.trim() && !isLoading"
                            :class="['p-3.5 rounded-xl shadow-md transition-all',
                                    isLoading ? 'bg-red-500 hover:bg-red-600 text-white' : 'bg-blue-500 hover:bg-blue-600 text-white',
                                    'disabled:opacity-50 disabled:cursor-not-allowed']">
                        <i :class="isLoading ? 'fas fa-stop' : 'fas fa-paper-plane'"></i>
                    </button>
                </div>
            </div>
        </footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.2.31/dist/vue.global.min.js"></script>
<script src="./request.js"></script>
<script>
    const {createApp, ref, nextTick, onMounted} = Vue;

    createApp({
        setup() {
            const messages = ref([]);
            const userInput = ref('');
            const isLoading = ref(false);
            const chatContainer = ref(null);
            const textarea = ref(null);
            const darkMode = ref(false);
            const userNickname = ref('游客用户');

            const isSidebarOpen = ref(true);
            const agentList = ref([]);
            const currentAgentId = ref(null);
            const sessionList = ref([]);
            const currentSessionId = ref('-1');

            let controller = null;
            let typingInterval = null;

            // 针对 Result 实体的异步解析器
            const extractListData = async (res, apiName) => {
                if (!res) return [];

                let parsed = res;
                // 1. 如果 myFetch 返回的是原生的 fetch Response 对象，需执行反序列化
                if (typeof res.json === 'function') {
                    try {
                        parsed = await res.json();
                    } catch(e) {
                        console.error(`[${apiName}] JSON解析异常:`, e);
                        return [];
                    }
                } else if (typeof res === 'string') {
                    try { parsed = JSON.parse(res); } catch (e) { return []; }
                }

                console.log(`[${apiName}] 后端返回的 Result 对象:`, parsed);

                // 2. 精确匹配后端的 Result 对象结构
                if (parsed && typeof parsed === 'object') {
                    // 满足 success 为 true 且 data 有值
                    if (parsed.success === true && parsed.data !== undefined) {
                        return Array.isArray(parsed.data) ? parsed.data : [];
                    }
                    // 兼容通过 Axios 请求多包一层 data 的情况
                    if (parsed.data && parsed.data.success === true && parsed.data.data !== undefined) {
                        return Array.isArray(parsed.data.data) ? parsed.data.data : [];
                    }
                }

                // 兜底方案：如果后端直接返回数组
                if (Array.isArray(parsed)) return parsed;

                return [];
            };

            const fetchUserInfo = async () => {
                try {
                    let result = await myFetch('/user/me', { method: 'POST' });
                    // 解析 response
                    if (result && typeof result.json === 'function') {
                        result = await result.json();
                    } else if (typeof result === 'string') {
                        result = JSON.parse(result);
                    }

                    let data = result?.data?.data || result?.data || result;
                    if (data && data.nickname) userNickname.value = data.nickname;
                } catch (e) {}
            };

            const fetchAgentList = async () => {
                try {
                    const result = await myFetch('/chat/agentInfo', { method: 'GET' });
                    // 这里需要添加 await，因为解析器现在是异步的
                    const list = await extractListData(result, '/chat/agentInfo');

                    agentList.value = list;
                    if (list.length > 0 && !currentAgentId.value) {
                        currentAgentId.value = list[0].id;
                    }
                } catch (e) {
                    console.error("智能体列表加载异常", e);
                }
            };

            const fetchSessionList = async () => {
                try {
                    const result = await myFetch('/chat/allSession', { method: 'GET' });
                    // 使用 await
                    const list = await extractListData(result, '/chat/allSession');
                    sessionList.value = list;
                } catch (e) {
                    console.error("会话列表获取异常:", e);
                }
            };

            const handleSelectSession = async (session) => {
                if (String(currentSessionId.value) === String(session.id) || isLoading.value) return;
                currentSessionId.value = session.id;
                if(session.agentId) currentAgentId.value = session.agentId;
                await loadHistory();
            };

            const startNewConversation = () => {
                if(isLoading.value) return;
                currentSessionId.value = '-1';
                messages.value = [];
                messages.value.push({
                    role: 'assistant',
                    content: '您好！我是AI志愿填报顾问，很高兴为您服务。开启一段新对话吧！',
                    isLoading: false,
                    visibleChars: 100,
                    isStreaming: false
                });
                scrollToBottom();
            };

            const loadHistory = async () => {
                if(currentSessionId.value === '-1') return;
                try {
                    const result = await myFetch('/chat/memory', {
                        method: 'GET',
                        headers: { 'X-Session-Id': String(currentSessionId.value) }
                    });

                    // 使用 await 等待解析完成
                    const historyData = await extractListData(result, '/chat/memory');

                    if (historyData.length > 0) {
                        messages.value = historyData.map(msg => ({
                            role: msg.role === 0 ? 'user' : 'assistant',
                            content: msg.content || '',
                            isLoading: false,
                            visibleChars: msg.content ? msg.content.length : 0,
                            isStreaming: false
                        }));
                        scrollToBottom();
                    } else {
                        messages.value = [];
                    }
                } catch (error) {
                    console.error("历史记录加载异常:", error);
                }
            };

            const adjustTextareaHeight = () => {
                const el = textarea.value;
                if (!el) return;
                el.style.height = 'auto';
                el.style.height = `${Math.min(el.scrollHeight, 200)}px`;
            };

            const scrollToBottom = () => {
                nextTick(() => {
                    if (chatContainer.value) {
                        chatContainer.value.scrollTop = chatContainer.value.scrollHeight;
                    }
                });
            };

            const toggleDarkMode = () => {
                darkMode.value = !darkMode.value;
                localStorage.setItem('darkMode', darkMode.value);
            };

            const sendMessage = async () => {
                if (!userInput.value.trim() || isLoading.value) return;

                if (controller) controller.abort();
                controller = new AbortController();

                const userMsgContent = userInput.value.trim();
                messages.value.push({ role: 'user', content: userMsgContent, visibleChars: userMsgContent.length });
                messages.value.push({ role: 'assistant', content: '', isLoading: true, visibleChars: 0, isStreaming: true });

                userInput.value = '';
                adjustTextareaHeight();
                scrollToBottom();
                isLoading.value = true;

                const isNewSession = currentSessionId.value === '-1';

                try {
                    // 使用你 Controller 中的访问路径
                    const url = `/chat/process`;

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Session-Id': String(currentSessionId.value),
                            'Authorization': localStorage.getItem('token') || ''
                        },
                        body: JSON.stringify({
                            message: userMsgContent,
                            agentId: currentAgentId.value
                        }),
                        signal: controller.signal
                    });

                    if (!response.ok) throw new Error(`HTTP 异常! 状态码: ${response.status}`);

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let buffer = '';
                    let messageIndex = messages.value.length - 1;

                    while (true) {
                        const {done, value} = await reader.read();
                        if (done) break;

                        // 1. 解码当前数据块
                        const chunk = decoder.decode(value, {stream: true});

                        // 2. 【核心修复】：按行分割，标准解析 SSE 协议
                        const lines = chunk.split('\n');
                        for (let line of lines) {
                            // 严格匹配 SSE 的 data 标识
                            if (line.startsWith('data:')) {
                                // 截掉前面的 'data:' (5个字符)
                                let text = line.substring(5);
                                // 如果后面带了一个标准空格，也顺手去掉
                                if (text.startsWith(' ')) {
                                    text = text.substring(1);
                                }
                                // 将纯净的文字追加到 buffer
                                buffer += text;
                            }
                        }

                        // 3. 赋值给视图层
                        messages.value[messageIndex].content = buffer;
                        messages.value[messageIndex].isLoading = false;

                        if (!typingInterval) {
                            typingInterval = setInterval(() => {
                                if (messages.value[messageIndex].visibleChars < messages.value[messageIndex].content.length) {
                                    messages.value[messageIndex].visibleChars++;
                                    scrollToBottom();
                                }
                            }, 20);
                        }
                    }

                    if (isNewSession) {
                        await fetchSessionList();
                        if(sessionList.value.length > 0) {
                            currentSessionId.value = sessionList.value[0].id;
                        }
                    }

                } catch (error) {
                    if (error.name !== 'AbortError') {
                        const lastMsg = messages.value[messages.value.length - 1];
                        lastMsg.content = '生成操作中断，请检查连接状态。';
                        lastMsg.visibleChars = lastMsg.content.length;
                    }
                } finally {
                    clearInterval(typingInterval);
                    typingInterval = null;
                    const lastMsg = messages.value[messages.value.length - 1];
                    lastMsg.isLoading = false;
                    lastMsg.isStreaming = false;
                    lastMsg.visibleChars = lastMsg.content.length;
                    isLoading.value = false;
                    scrollToBottom();
                }
            };

            const stopResponse = () => { if (controller) controller.abort(); };

            onMounted(async () => {
                if (window.innerWidth < 768) isSidebarOpen.value = false;
                darkMode.value = localStorage.getItem('darkMode') === 'true';

                await fetchUserInfo();
                await fetchAgentList();
                await fetchSessionList();

                if (sessionList.value.length > 0) {
                    await handleSelectSession(sessionList.value[0]);
                } else {
                    startNewConversation();
                }

                nextTick(() => textarea.value?.focus());
            });

            return {
                messages, userInput, isLoading, darkMode, userNickname,
                chatContainer, textarea, isSidebarOpen,
                agentList, currentAgentId, sessionList, currentSessionId,
                sendMessage, stopResponse, toggleDarkMode, adjustTextareaHeight,
                startNewConversation, handleSelectSession,
                goToLogin: () => window.location.href = '/login.html',
                goToRecharge: () => window.location.href = '/recharge.html'
            };
        }
    }).mount('#app');
</script>
</body>
</html>
