<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AI志愿填报顾问</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.31/dist/vue.global.min.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .login-card {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-50">
<div id="app" :class="['min-h-screen flex flex-col', darkMode ? 'bg-gray-900' : 'bg-gray-50']">
    <header :class="['py-4 px-6 shadow-sm flex items-center justify-between', darkMode ? 'bg-gray-800' : 'bg-white']">
        <div class="flex items-center cursor-pointer" @click="goBack">
            <i class="fas fa-chevron-left mr-2 text-gray-400"></i>
            <div class="text-xl font-bold text-blue-600">AI志愿填报顾问</div>
        </div>
        <button @click="toggleDarkMode" class="p-2 rounded-full hover:bg-gray-100 transition-colors">
            <i :class="darkMode ? 'fas fa-moon text-gray-300' : 'fas fa-sun text-gray-600'"></i>
        </button>
    </header>

    <main class="flex-1 flex items-center justify-center p-4">
        <div :class="['max-w-md w-full rounded-2xl shadow-xl p-8 login-card', darkMode ? 'bg-gray-800 border border-gray-700' : 'bg-white']">
            <div class="text-center mb-8">
                <h2 :class="['text-2xl font-bold', darkMode ? 'text-white' : 'text-gray-800']">欢迎回来</h2>
                <p :class="['mt-2 text-sm', darkMode ? 'text-gray-400' : 'text-gray-500']">请登录您的账号以继续使用</p>
            </div>

            <div class="flex mb-6 bg-gray-100 p-1 rounded-xl" :class="darkMode ? 'bg-gray-700' : 'bg-gray-100'">
                <button
                        @click="loginMode = 'account'"
                        :class="['flex-1 py-2 text-sm font-medium rounded-lg transition-all',
                             loginMode === 'account' ? (darkMode ? 'bg-gray-600 text-white' : 'bg-white text-blue-600 shadow-sm') : 'text-gray-500 hover:text-gray-700']">
                    账号登录
                </button>
                <button
                        @click="loginMode = 'phone'"
                        :class="['flex-1 py-2 text-sm font-medium rounded-lg transition-all',
                             loginMode === 'phone' ? (darkMode ? 'bg-gray-600 text-white' : 'bg-white text-blue-600 shadow-sm') : 'text-gray-500 hover:text-gray-700']">
                    手机登录
                </button>
            </div>

            <form @submit.prevent="handleLogin" class="space-y-4">
                <div v-if="loginMode === 'account'" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1" :class="darkMode ? 'text-gray-300' : 'text-gray-700'">用户名/邮箱</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                <i class="fas fa-user"></i>
                            </span>
                            <input
                                    v-model="form.username"
                                    type="text"
                                    required
                                    placeholder="输入您的账号"
                                    :class="['w-full pl-10 pr-4 py-3 border rounded-xl focus:ring-2 outline-none transition-all',
                                         darkMode ? 'bg-gray-700 border-gray-600 text-white focus:ring-blue-500' : 'bg-white border-gray-200 focus:ring-blue-400']">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1" :class="darkMode ? 'text-gray-300' : 'text-gray-700'">密码</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input
                                    v-model="form.password"
                                    :type="showPassword ? 'text' : 'password'"
                                    required
                                    placeholder="输入您的密码"
                                    :class="['w-full pl-10 pr-12 py-3 border rounded-xl focus:ring-2 outline-none transition-all',
                                         darkMode ? 'bg-gray-700 border-gray-600 text-white focus:ring-blue-500' : 'bg-white border-gray-200 focus:ring-blue-400']">
                            <button type="button" @click="showPassword = !showPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                                <i :class="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div v-if="loginMode === 'phone'" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1" :class="darkMode ? 'text-gray-300' : 'text-gray-700'">手机号码</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                <i class="fas fa-mobile-alt"></i>
                            </span>
                            <input
                                    v-model="form.phone"
                                    type="tel"
                                    required
                                    placeholder="11位手机号"
                                    :class="['w-full pl-10 pr-4 py-3 border rounded-xl focus:ring-2 outline-none transition-all',
                                         darkMode ? 'bg-gray-700 border-gray-600 text-white focus:ring-blue-500' : 'bg-white border-gray-200 focus:ring-blue-400']">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1" :class="darkMode ? 'text-gray-300' : 'text-gray-700'">验证码</label>
                        <div class="flex space-x-2">
                            <div class="relative flex-1">
                                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                    <i class="fas fa-shield-alt"></i>
                                </span>
                                <input
                                        v-model="form.code"
                                        type="text"
                                        required
                                        placeholder="6位验证码"
                                        :class="['w-full pl-10 pr-4 py-3 border rounded-xl focus:ring-2 outline-none transition-all',
                                             darkMode ? 'bg-gray-700 border-gray-600 text-white focus:ring-blue-500' : 'bg-white border-gray-200 focus:ring-blue-400']">
                            </div>
                            <button
                                    type="button"
                                    @click="sendSmsCode"
                                    :disabled="countdown > 0 || !form.phone"
                                    class="px-4 rounded-xl bg-gray-100 text-sm font-medium hover:bg-gray-200 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                                    :class="darkMode ? 'bg-gray-700 text-gray-300 hover:bg-gray-600' : 'bg-gray-100 text-gray-600'">
                                {{ countdown > 0 ? `${countdown}s后重发` : '获取验证码' }}
                            </button>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm py-2">
                    <label class="flex items-center cursor-pointer" :class="darkMode ? 'text-gray-400' : 'text-gray-600'">
                        <input type="checkbox" class="mr-2 rounded border-gray-300 text-blue-600">
                        记住我
                    </label>
                    <a href="#" class="text-blue-600 hover:underline">忘记密码?</a>
                </div>

                <button
                        type="submit"
                        :disabled="isSubmitting"
                        class="w-full py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 disabled:opacity-70 flex items-center justify-center">
                    <i v-if="isSubmitting" class="fas fa-circle-notch fa-spin mr-2"></i>
                    {{ isSubmitting ? '正在登录...' : '立即登录' }}
                </button>
            </form>

            <div class="mt-8 text-center">
                <p :class="['text-sm', darkMode ? 'text-gray-400' : 'text-gray-600']">
                    还没有账号?
                    <a href="/register.html" class="text-blue-600 font-bold hover:underline">立即注册</a>
                </p>
            </div>
        </div>
    </main>
</div>

<script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
        setup() {
            const darkMode = ref(false);
            const loginMode = ref('account'); // 'account' or 'phone'
            const showPassword = ref(false);
            const isSubmitting = ref(false);
            const countdown = ref(0);

            const form = ref({
                username: '',
                password: '',
                phone: '',
                code: ''
            });

            const toggleDarkMode = () => {
                darkMode.value = !darkMode.value;
                localStorage.setItem('darkMode', darkMode.value);
            };

            const goBack = () => {
                window.location.href = '/'; // 返回主页
            };

            const sendSmsCode = async () => {
                if (!form.value.phone) return;

                // --- 预留的验证码发送接口 ---
                console.log("正在向手机号发送验证码:", form.value.phone);

                // 模拟倒计时
                countdown.value = 60;
                const timer = setInterval(() => {
                    countdown.value--;
                    if (countdown.value <= 0) clearInterval(timer);
                }, 1000);

                // TODO: 真正的后端请求
                // await fetch(`/api/sendCode?phone=${form.value.phone}`);
            };

            const handleLogin = async () => {
                // 基础校验：如果信息不全，不发请求
                if (!form.value.username || !form.value.password) {
                    alert("请输入账号和密码");
                    return;
                }

                isSubmitting.value = true;

                // 构造要发送给后端的 JSON 数据对象（这就是后端对应的 LoginDTO）
                const payload = {
                    username: form.value.username,
                    password: form.value.password
                };

                try {
                    // 1. 修改路径为 /user/login，去掉 api
                    const response = await fetch('/user/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload), // 将对象转为字符串发送
                        credentials: 'include'
                    });

                    if (response.ok) {
                        const result = await response.json();
                        if (result.success) {
                            const token = result.data;
                            // 这里建议设置过期时间与后端一致，例如 30 分钟 (1800秒)
                            document.cookie = `token=${token}; path=/; max-age=1800`;

                            // 登录成功后，清除一下 localStorage 里的旧状态（如果有的话）
                            alert("登录成功！正在跳转...");
                            window.location.href = '/';
                        } else {
                            alert("登录失败: " + (result.errorMsg || "账号或密码错误"));
                        }
                    } else {
                        alert("服务器异常，错误码：" + response.status);
                    }
                } catch (error) {
                    console.error("请求出错:", error);
                    alert("网络连接失败，请检查后端是否启动");
                } finally {
                    isSubmitting.value = false;
                }
            };

            onMounted(() => {
                darkMode.value = localStorage.getItem('darkMode') === 'true' ||
                    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            });

            return {
                darkMode,
                loginMode,
                showPassword,
                isSubmitting,
                form,
                countdown,
                toggleDarkMode,
                goBack,
                sendSmsCode,
                handleLogin
            };
        }
    }).mount('#app');
</script>
</body>
</html>
